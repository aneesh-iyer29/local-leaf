name: Pages

# Publishes the landing page in site/ to https://aneesh-iyer29.github.io/local-leaf/.
# The screenshot and llms.txt are copied in at deploy time so each exists once in the repo.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'llms.txt'
      - 'docs/screenshot.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp docs/screenshot.png llms.txt site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
